<!DOCTYPE html>
<!-- 실행: 이 폴더에서 `python -m http.server 8000` 후 브라우저로 http://localhost:8000 접속 (file:// 로는 ES module과 assets/ fetch가 동작하지 않음) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한어울제 카트</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #8fc4ee;
  }
  #game {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  /* 부팅 로딩 오버레이 — main.js가 진행률을 갱신하고 로드 완료 후 제거한다. */
  #boot-loader {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: radial-gradient(ellipse at center, #1a2036 0%, #080a12 100%);
    color: #f0f2f8;
    font-family: 'Kenney Future', 'Segoe UI', Arial, sans-serif;
    transition: opacity 0.4s ease;
  }
  #boot-loader .boot-title {
    font-size: 40px;
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ff5e5e, #ffce54, #4dd0ff, #7c5cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #boot-loader .boot-bar {
    width: min(420px, 70vw);
    height: 10px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.18);
    overflow: hidden;
  }
  #boot-bar-fill {
    width: 0%;
    height: 100%;
    border-radius: 6px;
    background: linear-gradient(90deg, #ffe066, #ff8c00, #ff2d55);
    transition: width 0.15s linear;
  }
  #boot-status {
    font-size: 13px;
    opacity: 0.8;
    font-variant-numeric: tabular-nums;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="boot-loader">
  <div class="boot-title">한어울제 카트</div>
  <div class="boot-bar"><div id="boot-bar-fill"></div></div>
  <div id="boot-status">에셋 로딩 중…</div>
</div>
<script type="module" src="src/main.js"></script>
<!-- 손 인식 카메라 영상 오버레이 (handsteer/hand_steering.py 가 켜져 있을 때만 보인다) -->
<script type="module" src="src/camview.js"></script>
</body>
</html>
